openapi: 3.1.0
info:
  title: KOREA 예약정보 관리 API
  description: 여기자리 서비스 위한 API.
  version: 1.13.0
paths:
  /health:
    get:
      tags:
        - 서버 상태
      summary: 서버·DB 연결 확인
      description: 층 목록을 읽어 API와 DB에 접근할 수 있는지 확인합니다. 정상 응답은 `{"status":"ok"}`입니다. 센서·ESP32 연결 상태나 실제 착석 여부를 확인하는 API는 아닙니다.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /floors:
    get:
      tags:
        - 위치·좌석 조회
      summary: 층 목록 조회
      description: 등록된 층을 정렬 순서·ID 순으로 반환합니다. 로그인 없이 조회합니다. 응답의 `id`를 방·좌석 조회의 `floor_id`에 사용합니다.
      operationId: floors_floors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Floor'
                type: array
                title: Response Floors Floors Get
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /rooms:
    get:
      tags:
        - 위치·좌석 조회
      summary: 전체 또는 특정 층의 방 목록 조회
      description: '`floor_id`를 생략하면 전체 방, 지정하면 해당 층의 방을 반환합니다. 없는 층은 404입니다. 로그인 없이 조회합니다.'
      operationId: rooms_rooms_get
      parameters:
        - name: floor_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                maximum: 9223372036854776000
                exclusiveMinimum: 0
              - type: 'null'
            title: Floor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
                title: Response Rooms Rooms Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /seats:
    get:
      tags:
        - 위치·좌석 조회
      summary: 좌석 목록·현재 및 다음 예약 조회
      description: |-
        `floor_id`, `room_id`로 범위를 좁히고 `limit`·`offset`으로 나누어 조회합니다.

        좌석별 위치, 현재 예약, 다음 예정 예약, 남은 초, 마지막 저장 착석 상태를 반환합니다. `reservation_state=AVAILABLE`은 현재 예약이 없다는 뜻이며 비착석을 보장하지 않습니다. 현재 예약이 없으면 `remaining_seconds=null`입니다. 로그인 없이 조회합니다.
      operationId: seats_seats_get
      parameters:
        - name: floor_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                maximum: 9223372036854776000
                exclusiveMinimum: 0
              - type: 'null'
            title: Floor Id
        - name: room_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                maximum: 9223372036854776000
                exclusiveMinimum: 0
              - type: 'null'
            title: Room Id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 500
            minimum: 1
            default: 100
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
                title: Response Seats Seats Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /seats/{seat_id}:
    get:
      tags:
        - 위치·좌석 조회
      summary: 개별 좌석의 예약·착석 정보 조회
      description: |-
        전역 `seat_id`로 좌석을 조회합니다. 방 안의 표시 번호와 다릅니다. ESP32는 이 경로를 1~2초마다 요청해 `reservation_state`와 `remaining_seconds`를 읽을 수 있습니다.

        현재 유효 예약은 RESERVED, 없으면 AVAILABLE입니다. 예정 예약은 `next_reservation`으로 구분합니다. 착석 상태는 DB의 마지막 저장값이며 수신 중단 자동 판정이나 LED 명령을 포함하지 않습니다. 없는 좌석은 404입니다.
      operationId: seat_seats__seat_id__get
      parameters:
        - name: seat_id
          in: path
          required: true
          schema:
            type: integer
            maximum: 9223372036854776000
            exclusiveMinimum: 0
            title: Seat Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seat'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /reservations:
    post:
      tags:
        - 예약 등록·변경
      summary: 로그인 사용자 명의로 새 예약 생성
      description: |-
        `seat_id`를 입력합니다. 선택 항목 `def_time`은 총 이용시간(초)이며 생략·null이면 현재 관리자 설정의 기본 시간을 사용합니다.

        학번은 본문이 아닌 DemoSession에서 가져옵니다. 시작 시각은 서버 현재 시각으로 고정하고 status는 CONFIRMED로 생성합니다. 좌석 중복과 사용자 다중 활성 예약을 차단하며 예정 예약도 활성 예약에 포함합니다. 생성 당시 기본 시간·연장 한도를 별도 저장합니다.

        201과 생성한 예약을 반환합니다.
      operationId: create_reservation_reservations_post
      security:
        - DemoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
    get:
      tags:
        - 예약 조회
      summary: 전체 예약·좌석별 이력 조회
      description: |-
        공개 예약 목록입니다. `seat_id`, `effective_status`와 페이지 범위를 지정할 수 있으며 예약 ID 내림차순으로 반환합니다. 계산 상태는 SCHEDULED·IN_USE·ENDED·CANCELLED입니다. 검색 결과가 없으면 빈 배열입니다.

        본인 예약만 조회하는 경로는 `GET /me/reservations`이며 현재 IN_USE 예약만 제공합니다. 이 API는 학생 ID를 반환하지 않습니다.
      operationId: reservations_reservations_get
      parameters:
        - name: seat_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
                maximum: 9223372036854776000
                exclusiveMinimum: 0
              - type: 'null'
            title: Seat Id
        - name: effective_status
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - SCHEDULED
                  - IN_USE
                  - ENDED
                  - CANCELLED
                type: string
              - type: 'null'
            title: Effective Status
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 500
            minimum: 1
            default: 100
            title: Limit
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
                title: Response Reservations Reservations Get
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /reservations/{reservation_id}:
    get:
      tags:
        - 예약 조회
      summary: 예약 ID로 상세·현재 상태 조회
      description: '`reservation_id`는 좌석 번호가 아닌 예약 고유 ID입니다. 저장 상태와 서버 시각 기준 계산 상태, 남은 시간, 안내 문구, 생성 당시 설정과 연장 사용 횟수를 반환합니다. 삭제되었거나 없는 예약은 404입니다. 로그인 없이 조회합니다.'
      operationId: get_reservation_reservations__reservation_id__get
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema:
            type: integer
            maximum: 9223372036854776000
            exclusiveMinimum: 0
            title: Reservation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /reservations/{reservation_id}/extend:
    post:
      tags:
        - 예약 등록·변경
      summary: 생성 당시 기본 시간만큼 예약 연장
      description: |-
        **본문을 보내지 않습니다.** `{}`, `null`, `additional_seconds` JSON도 422입니다.

        예약에 저장된 `policy_default_duration_seconds`를 기존 종료 시각에 더하고 연장 횟수 1회를 소비합니다. 이후 관리자 설정이 변경되어도 기존 예약의 연장량·한도는 유지합니다. 횟수 초과는 409 EXTENSION_LIMIT_REACHED, 시간 충돌은 409 RESERVATION_CONFLICT이며 실패 시 시간·횟수를 모두 유지합니다. 종료·취소·만료 예약은 거부합니다.

        DemoSession 로그인이 필요합니다. 로그인 학번과 예약 소유자를 비교해 본인 예약만 처리합니다. 타인·소유자 없는 예약은 403이며 반복 요청도 소유자를 먼저 확인합니다.
      operationId: extend_reservation_reservations__reservation_id__extend_post
      security:
        - DemoSession: []
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema:
            type: integer
            maximum: 9223372036854776000
            exclusiveMinimum: 0
            title: Reservation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /reservations/{reservation_id}/move:
    post:
      tags:
        - 예약 등록·변경
      summary: 이용 중 예약의 좌석 이동
      description: |-
        `{"target_seat_id":5}`처럼 목적 좌석의 전역 ID를 입력합니다. 현재 IN_USE인 CONFIRMED 예약만 이동할 수 있습니다. 목적 좌석의 남은 예약 구간 충돌을 검사하고, 예약 ID·시작/종료 시각·생성 정책·연장 횟수와 각 좌석의 착석 상태를 유지합니다. 이동 이력은 기록합니다. 같은 좌석이면 기존 결과를 반환합니다.

        현재 예정 예약은 이동할 수 없습니다. DemoSession 로그인이 필요하며 본인 예약만 처리합니다. 타인·소유자 없는 예약은 403입니다. 동일 좌석 요청도 소유자를 먼저 확인합니다.
      operationId: move_reservation_reservations__reservation_id__move_post
      security:
        - DemoSession: []
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema:
            type: integer
            maximum: 9223372036854776000
            exclusiveMinimum: 0
            title: Reservation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationMove'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /reservations/{reservation_id}/cancel:
    post:
      tags:
        - 예약 등록·변경
      summary: 이용 중 예약 취소
      description: |-
        **본문 없이 호출**하여 저장 상태를 CANCELLED로 바꿉니다. 현재 IN_USE 예약만 취소할 수 있고 같은 취소를 반복하면 기존 결과를 반환합니다. 예정·자연 만료·종료 예약은 취소하지 못합니다. 예약을 물리 삭제하거나 착석 상태를 바꾸지는 않습니다.

        DemoSession 로그인이 필요합니다. 로그인 학번과 예약 소유자를 비교해 본인 예약만 처리합니다. 타인·소유자 없는 예약은 403이며 반복 요청도 소유자를 먼저 확인합니다.
      operationId: cancel_reservation_reservations__reservation_id__cancel_post
      security:
        - DemoSession: []
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema:
            type: integer
            maximum: 9223372036854776000
            exclusiveMinimum: 0
            title: Reservation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
  /reservations/{reservation_id}/end:
    post:
      tags:
        - 예약 등록·변경
      summary: 이용 중 예약 조기 종료
      description: |-
        **본문 없이 호출**하여 저장 상태를 ENDED로 바꿉니다. 현재 IN_USE 예약만 종료할 수 있고 같은 종료를 반복하면 기존 결과를 반환합니다. 예정·자연 만료·취소 예약은 변경하지 못합니다. 기존 종료일시나 센서 착석 상태를 수정하지 않습니다.

