components:
  schemas:
    AdminIdentity:
      properties:
        username:
          type: string
          title: Username
        created_at:
          type: integer
          title: Created At
        session_expires_at:
          type: integer
          title: Session Expires At
      type: object
      required:
      - username
      - created_at
      - session_expires_at
      title: AdminIdentity
    AdminLoginRequest:
      properties:
        username:
          type: string
          maxLength: 32
          minLength: 3
          pattern: "^[A-Za-z0-9_-]+$"
          title: Username
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      additionalProperties: false
      type: object
      required:
      - username
      - password
      title: AdminLoginRequest
    AdminLoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          const: bearer
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
        expires_at:
          type: integer
          title: Expires At
        admin:
          "$ref": "#/components/schemas/AdminIdentity"
      type: object
      required:
      - access_token
      - expires_in
      - expires_at
      - admin
      title: AdminLoginResponse
    AdminReservationCreate:
      properties:
        seat_id:
          type: integer
          maximum: 9223372036854776000
          exclusiveMinimum: 0
          title: Seat Id
        s_id:
          type: string
          maxLength: 10
          minLength: 10
          pattern: "^[0-9]{10}$"
          title: S Id
        starts_at:
          type: integer
          maximum: 9223372036854776000
          minimum: 0
          title: Starts At
        ends_at:
          type: integer
          maximum: 9223372036854776000
          minimum: 0
          title: Ends At
      additionalProperties: false
      type: object
      required:
      - seat_id
      - s_id
      - starts_at
      - ends_at
      title: AdminReservationCreate
    AdminReservationEdit:
      properties:
        starts_at:
          anyOf:
          - type: integer
            maximum: 9223372036854776000
            minimum: 0
          - type: 'null'
          title: Starts At
        ends_at:
          anyOf:
          - type: integer
            maximum: 9223372036854776000
            minimum: 0
          - type: 'null'
          title: Ends At
        status:
          anyOf:
          - type: string
            enum:
            - CONFIRMED
            - ENDED
            - CANCELLED
          - type: 'null'
          title: Status
      additionalProperties: false
      type: object
      title: AdminReservationEdit
    CleanupCounts:
      properties:
        reservations:
          type: integer
          title: Reservations
        reservation_moves:
          type: integer
          title: Reservation Moves
        reservation_owners:
          type: integer
          title: Reservation Owners
        user_sessions:
          type: integer
          title: User Sessions
        admin_sessions:
          type: integer
          title: Admin Sessions
      type: object
      required:
      - reservations
      - reservation_moves
      - reservation_owners
      - user_sessions
      - admin_sessions
      title: CleanupCounts
    CleanupRequest:
      properties:
        dry_run:
          type: boolean
          title: Dry Run
          default: true
        reservation_retention_days:
          type: integer
          maximum: 36500
          minimum: 0
          title: Reservation Retention Days
          default: 30
      additionalProperties: false
      type: object
      title: CleanupRequest
    CleanupResult:
      properties:
        dry_run:
          type: boolean
          title: Dry Run
        checked_at:
          type: integer
          title: Checked At
        reservation_retention_days:
          type: integer
          title: Reservation Retention Days
        reservation_cutoff_at:
          type: integer
          title: Reservation Cutoff At
        matched:
          "$ref": "#/components/schemas/CleanupCounts"
        deleted:
          "$ref": "#/components/schemas/CleanupCounts"
      type: object
      required:
      - dry_run
      - checked_at
      - reservation_retention_days
      - reservation_cutoff_at
      - matched
      - deleted
      title: CleanupResult
    DeviceReservationInfo:
      properties:
        seat_id:
          type: integer
          title: Seat Id
        reservation_state:
          type: string
          enum:
          - AVAILABLE
          - RESERVED
          title: Reservation State
        active_reservation_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Active Reservation Id
        starts_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Starts At
        ends_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ends At
        remaining_seconds:
          anyOf:
          - type: integer
