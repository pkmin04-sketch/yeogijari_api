  /admin/reservations:
    post:
      tags:
        - 관리자 예약 관리
      summary: 관리자 가상 예약 생성
      description: |-
        AdminSession이 필요합니다. `seat_id`, 등록된 사용자 `s_id`, `starts_at`, `ends_at`을 입력합니다. 시각은 UTC Unix 초 정수이며 과거·현재·미래 시각을 지정할 수 있습니다.

        시작 < 종료, 동일 좌석 CONFIRMED 예약의 시간 중복 및 사용자의 다중 활성 예약을 검사합니다. 앞 예약 종료와 다음 시작이 같으면 허용합니다. CONFIRMED로 생성하고 현재 설정의 기본 시간·연장 한도를 함께 저장합니다. 실제 이용시간은 입력한 종료−시작입니다. 성공은 201입니다.
      operationId: create_reservation_admin_reservations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReservationCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - AdminSession: []
  /admin/reservation-settings:
    get:
