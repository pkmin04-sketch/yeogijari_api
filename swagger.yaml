      description: |-
        AdminSession이 필요합니다. `default_duration_seconds`는 양의 정수 초, `max_extensions`는 0 이상의 정수입니다. 0회면 일반 연장을 허용하지 않습니다. 생략한 필드는 유지하고 `{}`·명시적 null·잘못된 자료형은 422입니다.

        변경은 **이후 새로 만드는 예약부터** 적용합니다. 기존 활성·예정 예약은 생성 당시 기본 시간·한도를 유지합니다. 예약 생성에서 명시적 def_time을 보내면 그 시간을 사용하므로 이 설정은 기본값이며 총 이용시간 상한이 아닙니다. 실제 값이 바뀔 때만 수정 시각·관리자 ID를 갱신합니다.
