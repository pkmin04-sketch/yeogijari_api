        - 관리자 예약 설정
      summary: 관리자 기본 예약 시간·연장 한도 조회
      description: AdminSession이 필요합니다. `default_duration_seconds`, `max_extensions`, `updated_at`, `updated_by`를 반환합니다. 초기값은 21600초(6시간)·2회이며 관리자가 변경한 실제 저장값을 조회합니다.
