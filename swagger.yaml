  /admin/maintenance/cleanup:
    post:
      tags:
        - 관리자 데이터 정리
      summary: 관리자 만료 데이터 미리보기·삭제
      description: |-
        AdminSession이 필요합니다. 기본 본문은 `{"dry_run":true,"reservation_retention_days":30}`입니다. `{}`도 같은 기본값으로 처리합니다.

        - dry_run=true: 삭제 대상 건수를 반환합니다.
        - dry_run=false: 만료 사용자·관리자 세션과 보관기간이 지난 종료·취소·자연 만료 예약을 삭제합니다.
        - 예약 보관기간은 자연 만료의 종료 시각 또는 명시적 종료·취소 상태 변경 시각부터 계산합니다.
        - 연결된 예약 정책·소유자·이동 이력·시간 캐시·이력 진행 정보는 연쇄 삭제됩니다. 사용자·프로필·관리자 계정·현재 설정·독립 이용 이력은 유지합니다.

        응답 건수는 예약·이동·소유자·세션을 별도 집계하며 모든 연쇄 삭제 테이블을 나열하지는 않습니다. 미리보기라도 지연된 이용 이력 기록과 시간 캐시 갱신은 수행할 수 있습니다.
      operationId: cleanup_admin_maintenance_cleanup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupResult'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - AdminSession: []
