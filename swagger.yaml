    DemoSession:
      type: http
      description: POST /auth/login 응답의 access_token. 학번만 사용하는 시연용 식별입니다.
      scheme: bearer
    AdminSession:
      type: http
      description: POST /admin/auth/login의 access_token 값만 입력하세요.
      scheme: bearer
tags:
- name: ESP32 상태 통신
  description: 인증 없이 착석 상태를 수신하고 ESP32에 현재·다음 예약정보를 전달합니다.
- name: 서버 상태
  description: 서버와 데이터베이스 연결 상태 확인.
- name: 사용자 등록·인증
  description: 사용자 별도 등록, 학번 로그인, 로그아웃. 실제 학생 본인 여부는 검증하지 않습니다.
- name: 내 정보·예약 조회
  description: DemoSession 토큰으로 내 프로필·이용 중 예약·예약 및 이동 기반 좌석 이력을 조회합니다.
- name: 위치·좌석 조회
  description: 로그인 없이 층·방·좌석 위치와 현재·다음 예약, 시간 안내를 조회합니다.
- name: 예약 조회
  description: 공개 예약 목록·상세·좌석별 이력 조회.
- name: 예약 등록·변경
  description: 예약 생성과 이용시간 변경·연장·좌석 이동·취소·종료. 생성은 DemoSession 필수이며 다른 동작의 기존 접근 정책은
    유지합니다.
- name: 관리자 인증
  description: 관리자 ID·비밀번호 로그인과 AdminSession 확인·로그아웃.
- name: 관리자 예약 관리
  description: AdminSession 토큰으로 사용자·시각 지정 등록, 시각·상태 수정, 개별 영구 삭제.
- name: 관리자 데이터 정리
  description: AdminSession 토큰으로 만료 예약·세션 정리. 기본은 삭제하지 않는 미리보기입니다.
